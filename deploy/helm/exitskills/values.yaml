replicaCount: 1

image:
  repository: ghcr.io/cloud-exit/exitskills
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

config:
  listenAddress: ":8080"
  # Leave headroom below the default 512 MiB container limit.
  goMemoryLimit: "384MiB"
  publicBaseUrl: "https://skills.exitmesh.com"
  # Set both values to enable the boot-time and indexing LLM gate.
  aiBaseUrl: ""
  aiModel: ""
  githubApiBaseUrl: "https://api.github.com"
  officialSkillsUrl: "https://www.skills.sh/official"
  indexInterval: "24h"
  indexOnStart: true
  indexConcurrency: 8
  logLevel: "info"
  rateLimitRequests: 600
  rateLimitWindow: "1m"
  requestTimeout: "30s"

# Prefer existingSecret in production. It must contain DATABASE_URL,
# ENCRYPTION_KEY, MASTER_TOKEN, AI_API_KEY when needed, and exactly one GitHub
# auth mode: GITHUB_TOKEN or GITHUB_CLIENT_ID plus GITHUB_CLIENT_SECRET.
# Complete OAuth credentials take precedence if both modes are populated.
existingSecret: ""
secrets:
  databaseUrl: ""
  githubToken: ""
  githubClientId: ""
  githubClientSecret: ""
  encryptionKey: ""
  masterToken: ""
  aiApiKey: ""

nodeSelector: {}
tolerations: []
affinity: {}
