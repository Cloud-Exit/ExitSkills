{{- if not .Values.existingSecret }}
{{- $oauthConfigured := and .Values.secrets.githubClientId .Values.secrets.githubClientSecret }}
{{- if and (not .Values.secrets.githubToken) (not $oauthConfigured) }}
{{- fail "configure secrets.githubToken or both secrets.githubClientId and secrets.githubClientSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "exitmesh-skills.fullname" . }}
  labels:
    {{- include "exitmesh-skills.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl or existingSecret is required" .Values.secrets.databaseUrl | quote }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  GITHUB_CLIENT_ID: {{ .Values.secrets.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.githubClientSecret | quote }}
  ENCRYPTION_KEY: {{ required "secrets.encryptionKey or existingSecret is required" .Values.secrets.encryptionKey | quote }}
  MASTER_TOKEN: {{ required "secrets.masterToken or existingSecret is required" .Values.secrets.masterToken | quote }}
  AI_API_KEY: {{ .Values.secrets.aiApiKey | quote }}
{{- end }}
