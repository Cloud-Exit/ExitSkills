name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt-check
      - run: make vet
      - run: make test-race
      - run: make build
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/exitmesh-skills --set existingSecret=exitmesh-skills

