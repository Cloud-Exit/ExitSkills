name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Choose version
        id: version
        shell: bash
        run: |
          version="v0.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${version#v}" >> "$GITHUB_OUTPUT"
      - name: Test and build
        run: |
          make fmt-check verify vet test-race
          make build VERSION="${{ steps.version.outputs.version }}"
      - name: Package Helm chart
        run: |
          mkdir -p dist
          helm lint deploy/helm/exitmesh-skills --set existingSecret=exitmesh-skills
          helm package deploy/helm/exitmesh-skills \
            --version "${{ steps.version.outputs.chart_version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist
          cp bin/server bin/admin dist/
      - name: Publish container image
        env:
          REGISTRY: ghcr.io
          IMAGE: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          image="${REGISTRY}/${IMAGE,,}"
          docker build --build-arg VERSION="$VERSION" -t "$image:$VERSION" -t "$image:latest" .
          docker push "$image:$VERSION"
          docker push "$image:latest"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --generate-notes --title "$VERSION"
