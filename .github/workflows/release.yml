name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Choose version
        id: version
        shell: bash
        run: |
          base_version="$(awk '$1 == "version:" { print $2; exit }' deploy/helm/exitmesh-skills/Chart.yaml)"
          if ! [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Chart version is not MAJOR.MINOR.PATCH: $base_version" >&2
            exit 1
          fi
          release_line="${base_version%.*}"
          latest_version="$(git tag --list "v${release_line}.*" | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          version="$base_version"
          if [[ -n "$latest_version" ]]; then
            IFS=. read -r major minor patch <<< "$latest_version"
            version="${major}.${minor}.$((patch + 1))"
          fi
          tag=v${version}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Test and build
        run: |
          make fmt-check verify vet test-race
          make build VERSION="${{ steps.version.outputs.version }}"
      - name: Package Helm chart
        run: |
          mkdir -p dist
          helm lint deploy/helm/exitmesh-skills --set existingSecret=exitmesh-skills
          helm package deploy/helm/exitmesh-skills \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist
          cp bin/server bin/admin dist/
      - name: Normalize container image name
        id: image
        shell: bash
        run: |
          image=${REGISTRY}/${GITHUB_REPOSITORY,,}
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          helm_registry=oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}
          echo "helm_registry=${helm_registry}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SOURCE=https://github.com/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Publish Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login "$REGISTRY" --username "${{ github.actor }}" --password-stdin
          helm push "dist/exitmesh-skills-${{ steps.version.outputs.version }}.tgz" "${{ steps.image.outputs.helm_registry }}"
      - name: Remove invalid legacy release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete v0.20260715.3 --cleanup-tag --yes || true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --generate-notes --title "$VERSION"
